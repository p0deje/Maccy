name: macOS 26 ARM CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: macos26-arm-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint + diagnostics
    runs-on: macos-26
    timeout-minutes: 15
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log directories
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Print runner and toolchain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== Date =="
            date -u
            echo
            echo "== Runner =="
            echo "RUNNER_OS=${RUNNER_OS:-}"
            echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
            echo "ImageOS=${ImageOS:-}"
            echo "ImageVersion=${ImageVersion:-}"
            echo
            echo "== macOS =="
            sw_vers
            echo
            echo "== Kernel and CPU =="
            uname -a
            uname -m
            sysctl -n machdep.cpu.brand_string || true
            sysctl hw.optional.arm64 || true
            echo
            echo "== Xcode =="
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
            echo
            echo "== Hardware profile =="
            system_profiler SPHardwareDataType SPSoftwareDataType SPDeveloperToolsDataType
            echo
            echo "== Environment =="
            printenv | sort
          } 2>&1 | tee "$LOG_DIR/diagnostics.log"

      - name: Enforce requested macOS 26 ARM runner
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_VERSION="$(sw_vers -productVersion)"
          MACHINE_ARCH="$(uname -m)"
          echo "Detected macOS version: $PRODUCT_VERSION"
          echo "Detected architecture: $MACHINE_ARCH"
          if [[ "$PRODUCT_VERSION" != 26.* ]]; then
            echo "Expected macOS 26.x, got $PRODUCT_VERSION"
            exit 1
          fi
          if [[ "$MACHINE_ARCH" != arm64 ]]; then
            echo "Expected arm64 runner, got $MACHINE_ARCH"
            exit 1
          fi

      - name: Run SwiftLint
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version
          swiftlint lint --quiet --strict --no-cache 2>&1 | tee "$LOG_DIR/swiftlint.log"

      - name: Self-scan swiftlint log
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' "$LOG_DIR/swiftlint.log" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "SwiftLint warnings/errors found"
            exit 1
          fi

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: warn
          retention-days: 14

  test-shards:
    name: shard (${{ matrix.shard }})
    needs: lint
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: ${{ !matrix.block }}
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        include:
          # unit shard runs all of MaccyTests EXCEPT the perf classes (which run
          # in the non-blocking `perf` shard). Keep this skip-list and the perf
          # shard's only-list in sync as perf classes are added.
          - shard: unit
            only: "MaccyTests"
            skip: "MaccyTests/PerformanceHarnessWiringTest MaccyTests/HistoryItemPerformanceTests MaccyTests/ImageDecodePerformanceTests MaccyTests/TextSearchPerformanceTests MaccyTests/CorpusGeneratorTests"
            block: true
          - shard: ui-1
            only: "MaccyUITests/MaccyUITests/testPopupWithHotkey MaccyUITests/MaccyUITests/testCloseWithHotkey MaccyUITests/MaccyUITests/testPopupWithMenubar MaccyUITests/MaccyUITests/testNewCopyIsAdded MaccyUITests/MaccyUITests/testSearch MaccyUITests/MaccyUITests/testCopyWithClick MaccyUITests/MaccyUITests/testDownArrow MaccyUITests/MaccyUITests/testUpArrow"
            skip: ""
            block: true
          - shard: ui-2
            only: "MaccyUITests/MaccyUITests/testCopyWithEnter MaccyUITests/MaccyUITests/testCopyWithCommandShortcut MaccyUITests/MaccyUITests/testCopyImage MaccyUITests/MaccyUITests/testCopyFile MaccyUITests/MaccyUITests/testCopyRTF MaccyUITests/MaccyUITests/testCopyHTML MaccyUITests/MaccyUITests/testSearchFiles"
            skip: ""
            block: true
          - shard: ui-3
            only: "MaccyUITests/MaccyUITests/testSearchAndCopyWithCommandShortcut MaccyUITests/MaccyUITests/testControlJ MaccyUITests/MaccyUITests/testControlK MaccyUITests/MaccyUITests/testDeleteEntry MaccyUITests/MaccyUITests/testDeleteEntryDuringSearch MaccyUITests/MaccyUITests/testClear MaccyUITests/MaccyUITests/testClearDuringSearch"
            skip: ""
            block: true
          - shard: ui-4
            only: "MaccyUITests/MaccyUITests/testClearAll MaccyUITests/MaccyUITests/testPin MaccyUITests/MaccyUITests/testPinDuringSearch MaccyUITests/MaccyUITests/testUnpin MaccyUITests/MaccyUITests/testRemoveLastWordFromSearchWithControlW MaccyUITests/MaccyUITests/testPasteToSearch MaccyUITests/MaccyUITests/testDisablesOnOptionClickingMenubarIcon"
            skip: ""
            block: true
          - shard: ui-5
            only: "MaccyUITests/MaccyUITests/testDisablesOnlyForNextCopyOnOptionShiftClickingMenubarIcon MaccyUITests/MaccyUITests/testCreatesNewCopyOnEnterWhenSearchResultsAreEmpty MaccyUITests/MaccyUITests/testOpenAndClose MaccyUITests/MaccyUITests/testOpenAndSelectSecondItem MaccyUITests/MaccyUITests/testOpenAndSelectThirdItem MaccyUITests/MaccyUITests/testOpenAndSelectThirdItemRepeatedPress MaccyUITests/MaccyUITests/testTogglePopupAndCloseOnClickOutside"
            skip: ""
            block: true
          # perf shards: split by category (image / text / mixed) into parallel
          # runners. BLOCKING (block: true) — a perf test failure (timeout, hang,
          # assertion) fails the run exactly like a unit/UI failure; perf is NOT
          # silently green. The self-scan below scans every shard's log for
          # failed/error/TEST-FAILED. Keep these only-lists and the unit shard's
          # skip-list above in sync as perf classes are added.
          - shard: perf-image
            only: "MaccyTests/ImageDecodePerformanceTests/testImageRenderFirst20 MaccyTests/ImageDecodePerformanceTests/testSingleLargeImageColdLoad MaccyTests/ImageDecodePerformanceTests/testManyImagesColdLoad_N200 MaccyTests/ImageDecodePerformanceTests/testMixedColdLoad_N200 MaccyTests/PerformanceHarnessWiringTest MaccyTests/HistoryItemPerformanceTests MaccyUITests/PerfRenderUITests/testImageRenderB MaccyUITests/PreviewRefreshUITests/testPreviewRefreshesAcrossNavigation"
            skip: ""
            block: true
          - shard: perf-text
            only: "MaccyTests/ImageDecodePerformanceTests/testTextRenderFirst20 MaccyTests/ImageDecodePerformanceTests/testProbeDetectsSynchronousMainStall MaccyTests/ImageDecodePerformanceTests/testGCopyPerCopyConsume_N200 MaccyTests/TextSearchPerformanceTests MaccyUITests/PerfRenderUITests/testTextRenderB"
            skip: ""
            block: true
          - shard: perf-mixed
            only: "MaccyTests/ImageDecodePerformanceTests/testMixedRenderFirst20 MaccyUITests/PerfRenderUITests/testMixedRenderB"
            skip: ""
            block: true
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      PROJECT: Maccy.xcodeproj
      SCHEME: Maccy
      CONFIGURATION: Debug
      DESTINATION: platform=macOS,arch=arm64
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLES: ${{ github.workspace }}/ci-result-bundles
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log and result directories
        shell: bash
        run: mkdir -p "$LOG_DIR" "$RESULT_BUNDLES"

      - name: Fetch shared perf corpus (perf shards only)
        if: ${{ startsWith(matrix.shard, 'perf-') }}
        shell: bash
        env:
          CORPUS_DIR: ${{ github.workspace }}/perf-corpus
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$CORPUS_DIR"
          # Corpus version = hash of the generator source (bump the corpus by
          # changing ImageFixtureGenerator.swift). The generate-perf-corpus
          # workflow publishes perf-corpus-<hash> Release assets.
          corpus_tag="perf-corpus-$(git rev-parse HEAD:MaccyTests/ImageFixtureGenerator.swift | cut -c1-16)"
          echo "Corpus tag: $corpus_tag"
          if gh release download "$corpus_tag" -p 'perf-corpus.tar.gz' -D /tmp 2>/dev/null; then
            tar -xzf /tmp/perf-corpus.tar.gz -C "$CORPUS_DIR"
            echo "Downloaded corpus: $(ls "$CORPUS_DIR" | wc -l) files"
          else
            echo "No prebuilt corpus for this generator version; tests will generate locally."
          fi
          echo "MACCY_PERF_FIXTURES=$CORPUS_DIR" >> "$GITHUB_ENV"

      - name: Build and test shard
        shell: bash
        run: |
          set -uo pipefail
          runner_noise_fopen='fopen fail''ed for data file: errno = 2 (No such file or directory)'
          runner_noise_io='IOServiceMatchingfail''ed for: AppleM2ScalerParavirtDriver'
          only_args=""
          for t in ${{ matrix.only }}; do only_args="$only_args -only-testing:$t"; done
          skip_args=""
          for t in ${{ matrix.skip }}; do skip_args="$skip_args -skip-testing:$t"; done
          # Perf shards are BLOCKING (block: true) — a perf failure fails the
          # run like any other test. They emit the SAME detailed awk-filtered
          # log as blocking shards (thousands of lines, incl. the XCUI t=
          # timeline that diagnoses hangs) plus a raw log. pipefail (set above)
          # makes a non-zero xcodebuild fail the step; the self-scan below is a
          # second gate that catches failed/error/TEST-FAILED in the log.
          if [[ "${{ matrix.shard }}" == perf-* ]]; then
            xcodebuild \
              -project "$PROJECT" -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" -destination "$DESTINATION" \
              -derivedDataPath "$DERIVED_DATA" \
              -resultBundlePath "$RESULT_BUNDLES/${{ matrix.shard }}.xcresult" \
              $only_args $skip_args \
              CODE_SIGNING_ALLOWED=NO \
              test 2>&1 \
              | tee "$LOG_DIR/${{ matrix.shard }}-raw.log" \
              | awk -v fopen="$runner_noise_fopen" -v io="$runner_noise_io" '
                  index($0, fopen) || index($0, io) || /IDELaunchParametersSnapshot:/ { next }
                  { print }
                ' \
              | tee "$LOG_DIR/${{ matrix.shard }}.log"
          else
            set -e
            xcodebuild \
              -project "$PROJECT" -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" -destination "$DESTINATION" \
              -derivedDataPath "$DERIVED_DATA" \
              -resultBundlePath "$RESULT_BUNDLES/${{ matrix.shard }}.xcresult" \
              $only_args $skip_args \
              CODE_SIGNING_ALLOWED=NO \
              test 2>&1 \
              | awk -v fopen="$runner_noise_fopen" -v io="$runner_noise_io" '
                  index($0, fopen) || index($0, io) || /IDELaunchParametersSnapshot:/ { next }
                  { print }
                ' \
              | tee "$LOG_DIR/${{ matrix.shard }}.log"
          fi

      - name: Self-scan shard log (all shards, incl. perf)
        if: ${{ matrix.block }}
        shell: bash
        run: |
          set -euo pipefail
          # Scans EVERY shard's log (perf shards are block: true too) for
          # warning/error/failed/TEST-FAILED. This is what catches a perf test
          # hang/failure — without it a perf shard's continue-on-error would
          # silently swallow the failure and the run would report green.
          # Tolerate benign headless-runner system noise — the Metal compiler
          # service and HDRImageConverter are unavailable on the GPU-less runner
          # and log "failed"/"falling back" lines that are not Maccy failures.
          # Also tolerate the one deliberately-triggered error log from the
          # dedup-index fault-injection test (`testTransientInitFetchFailure…`),
          # which exercises `BackgroundClipboardIngestor`'s init-retry path:
          # it is an *expected* error, not a regression. Exclude these from the
          # scan (see macos26-arm-ci history).
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:|\*\* TEST FAILED \*\*|Fatal error|[Ff]ailed)([^[:alpha:]]|$)' "$LOG_DIR/${{ matrix.shard }}.log" \
                    | grep -vE 'HDRImageConverter.*falling back to SIMD|MTLCompiler.*XPC_ERROR_CONNECTION_INVALID|Compiler failed with XPC_ERROR_CONNECTION_INVALID|Dedup index init failed; retry' || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings, errors, or failures found in ${{ matrix.shard }}.log"
            exit 1
          fi

      - name: Upload shard logs and result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs
            ci-result-bundles
          if-no-files-found: warn
          retention-days: 14
